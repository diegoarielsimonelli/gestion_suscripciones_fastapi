version: "3.8"

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: suscripciones_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: gestion_suscripciones
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
